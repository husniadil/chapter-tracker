<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter Tracker</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="Jadwal rilis chapter dan episode One Piece dalam WIB.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c23a1e'/%3E%3Crect x='6' y='20' width='20' height='3' fill='%23ffffff' opacity='.38'/%3E%3Crect x='6' y='20' width='13' height='3' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  /* One accent, used only for status and progress. Never for primary data.
     One corner radius: none. One theme, following the system. */
  :root {
    --bg: #fbfbfa;
    --fg: #16161a;
    --muted: #6b6b73;
    --rule: #e2e2df;
    --rule-strong: #cfcfca;
    --skeleton: #e8e8e5;
    --accent: #c23a1e;
    --accent-wash: rgba(194, 58, 30, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --fg: #f4f4f5;
      --muted: #8f8f99;
      --rule: #222226;
      --rule-strong: #35353c;
      --skeleton: #1c1c20;
      --accent: #ff6a45;
      --accent-wash: rgba(255, 106, 69, 0.10);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "tnum" 1;
    padding: 28px 22px 44px;
  }
  main {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  a { color: inherit; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  a:focus-visible,
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .wordmark {
    margin: 0 0 56px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* Alert. Prominent by construction, never dismissable. */
  .alert {
    border-left: 2px solid var(--accent);
    background: var(--accent-wash);
    padding: 14px 16px;
    margin: 0 0 40px;
  }
  .alert h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }
  .alert p { margin: 5px 0 0; font-size: 14px; color: var(--muted); }
  .alert .diagnostic {
    margin-top: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.45;
    word-break: break-word;
  }

  /* Next release. The one moment on the page. */
  .release { margin: 0 0 8px; }

  .break {
    margin: 0 0 10px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--accent);
  }

  .headline {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 12px;
    margin: 0;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .headline .skeleton-text {
    display: inline-block;
    width: 8ch;
    height: 0.8em;
    background: var(--skeleton);
  }

  .tag {
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    padding: 5px 8px;
    border: 1px solid var(--rule-strong);
    color: var(--muted);
    white-space: nowrap;
  }
  .tag[data-state="confirmed"] { border-color: var(--accent); color: var(--accent); }

  .when { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
  .caveat { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

  /* Sized to its own content so the unit labels sit flush under their digits
     and the progress rule ends where the last digit ends. */
  .timer { display: inline-block; margin-top: 34px; }

  .clock {
    display: grid;
    grid-template-columns: repeat(4, max-content);
    column-gap: clamp(14px, 4vw, 26px);
  }
  .clock b {
    display: block;
    font-size: clamp(46px, 13.5vw, 92px);
    font-weight: 600;
    line-height: 0.94;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
  }
  .clock small {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .is-loading .clock b { color: var(--skeleton); }

  .progress {
    height: 2px;
    width: 100%;
    margin: 28px 0 0;
    background: var(--rule);
  }
  .progress span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
  }
  @media (prefers-reduced-motion: no-preference) {
    /* Motivated: the bar slides to its real position so the fill reads as
       elapsed time rather than as a static graphic. */
    .progress span { transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1); }
  }

  /* Airing schedule. Deliberately a different layout family from the release
     block above: a data grid rather than a display moment. */
  .airing { margin-top: 68px; }
  /* Without a countdown the release block is two lines tall, so the standard
     gap below it reads as a hole. */
  .is-released .airing { margin-top: 46px; }
  .airing h2 {
    margin: 0 0 22px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .airing .status { margin: 0; font-size: 14px; color: var(--muted); }

  /* Columns run to the page edge so episode numbers line up with the headline
     and section title above them. */
  .episodes {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: 20px;
    row-gap: 26px;
    margin: 0;
    padding: 17px 0 0;
    list-style: none;
    border-top: 1px solid var(--rule);
  }
  .episodes .num {
    display: block;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .episodes li:first-child .num { color: var(--fg); }
  .episodes .date { display: block; margin-top: 7px; font-size: 13px; color: var(--muted); }
  .episodes .time { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); }
  .episodes .zone { font-size: 11px; }

  footer {
    margin-top: 68px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 13px;
  }
  footer p { margin: 0; }
  footer p + p { margin-top: 4px; }

  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    .wordmark { margin-bottom: 44px; }
    .episodes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .airing { margin-top: 56px; }
    footer { margin-top: 56px; }
  }
</style>
</head>
<body>
<main class="is-loading" id="page">
  <p class="wordmark">Chapter Tracker</p>

  <div class="alert" id="alert" hidden>
    <h2 id="alert-title"></h2>
    <p id="alert-body"></p>
    <p class="diagnostic" id="alert-diagnostic" hidden></p>
  </div>

  <section class="release">
    <p class="break" id="break" hidden>Minggu ini libur</p>

    <h1 class="headline">
      <span id="headline"><span class="skeleton-text"></span></span>
      <span class="tag" id="tag" hidden></span>
    </h1>
    <p class="when" id="when"></p>
    <p class="caveat" id="caveat" hidden></p>

    <div class="timer" id="timer">
      <div class="clock" aria-hidden="true">
        <div><b id="cd-d">00</b><small>hari</small></div>
        <div><b id="cd-h">00</b><small>jam</small></div>
        <div><b id="cd-m">00</b><small>menit</small></div>
        <div><b id="cd-s">00</b><small>detik</small></div>
      </div>
      <div class="progress" id="progress" hidden><span id="progress-fill"></span></div>
    </div>
  </section>

  <section class="airing">
    <h2>Anime</h2>
    <p class="status" id="airing-status">Memuat jadwal tayang.</p>
    <ol class="episodes" id="episodes" hidden></ol>
  </section>

  <footer>
    <p id="updated"></p>
    <p>Data dari <a href="https://mangaplus.shueisha.co.jp" rel="noreferrer">MANGA Plus</a>
       dan <a href="https://anilist.co" rel="noreferrer">AniList</a>.</p>
  </footer>
</main>

<script>
"use strict";

/* === projection:begin ===
   Works out the next release when MANGA Plus has not announced one, using the
   three-on / one-off rotation anchored on the last known release. Kept free of
   DOM access so scripts/test_projection.mjs can run this exact source. */

var DAY_MS = 24 * 60 * 60 * 1000;
var WEEK_MS = 7 * DAY_MS;
var GAP_TOLERANCE_MS = DAY_MS;
var WEEKS_ON_BEFORE_BREAK = 3;

/* How many releases in a row, ending at the newest one, were a week apart. */
function weeklyRunLength(times) {
  var sorted = times
    .filter(function (t) { return typeof t === "number" && isFinite(t); })
    .filter(function (t, i, a) { return a.indexOf(t) === i; })
    .sort(function (a, b) { return a - b; });
  if (sorted.length === 0) return 0;
  var run = 1;
  for (var i = sorted.length - 1; i > 0; i--) {
    if (Math.abs(sorted[i] - sorted[i - 1] - WEEK_MS) <= GAP_TOLERANCE_MS) run++;
    else break;
  }
  return run;
}

/* Three weeks running means the fourth is the rotation's off week. */
function projectNextRelease(latestMs, recentMs) {
  var run = weeklyRunLength((recentMs || []).concat([latestMs]));
  if (run >= WEEKS_ON_BEFORE_BREAK) {
    return { at: latestMs + 2 * WEEK_MS, source: "projected-break" };
  }
  return { at: latestMs + WEEK_MS, source: "projected-weekly" };
}

/* An announced date always wins over the projection. */
function resolveNextRelease(schedule) {
  var latest = Date.parse(schedule.latest_release_utc);
  if (!isFinite(latest)) return null;

  var recent = (schedule.recent_releases_utc || [])
    .map(Date.parse)
    .filter(function (t) { return isFinite(t); });

  var at, source;
  var announced = schedule.next_confirmed ? Date.parse(schedule.next_release_utc) : NaN;
  if (isFinite(announced)) {
    at = announced;
    source = "confirmed";
  } else {
    var projection = projectNextRelease(latest, recent);
    at = projection.at;
    source = projection.source;
  }

  var gapDays = (at - latest) / DAY_MS;
  return {
    at: at,
    source: source,
    confirmed: source === "confirmed",
    gapDays: gapDays,
    breakWeek: gapDays > 7 + GAP_TOLERANCE_MS / DAY_MS
  };
}
/* === projection:end === */

var WIB = "Asia/Jakarta";
var fullWib = new Intl.DateTimeFormat("id-ID", {
  timeZone: WIB, weekday: "long", day: "numeric", month: "long",
  year: "numeric", hour: "2-digit", minute: "2-digit"
});
var dayWib = new Intl.DateTimeFormat("id-ID", {
  timeZone: WIB, weekday: "long", day: "numeric", month: "long"
});
var shortDayWib = new Intl.DateTimeFormat("id-ID", {
  timeZone: WIB, weekday: "short", day: "numeric", month: "short"
});
var clockWib = new Intl.DateTimeFormat("id-ID", {
  timeZone: WIB, hour: "2-digit", minute: "2-digit"
});

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : String(n); }
function stamp(ms) { return fullWib.format(new Date(ms)) + " WIB"; }
function day(ms) { return dayWib.format(new Date(ms)); }

var target = null;
var released = false;

function tick() {
  if (target === null) return;
  var left = target - Date.now();
  if (left <= 0 && !released) {
    released = true;
    render.released();
  }
  var s = Math.max(0, Math.floor(left / 1000));
  el("cd-d").textContent = pad(Math.floor(s / 86400));
  el("cd-h").textContent = pad(Math.floor(s / 3600) % 24);
  el("cd-m").textContent = pad(Math.floor(s / 60) % 60);
  el("cd-s").textContent = pad(s % 60);
}

var render = {
  released: function () {
    el("page").classList.add("is-released");
    el("timer").hidden = true;
    el("progress").hidden = true;
    el("caveat").hidden = true;
    el("break").hidden = true;
    el("tag").hidden = true;
    el("when").textContent = target ? "Sudah terbit " + stamp(target) + "." : "Sudah terbit.";
  }
};

function renderSchedule(schedule) {
  var page = el("page");
  page.classList.remove("is-loading");

  page.classList.remove("is-released");
  el("alert").hidden = true;
  el("alert-diagnostic").hidden = true;
  el("break").hidden = true;
  el("caveat").hidden = true;
  el("tag").hidden = true;
  el("progress").hidden = true;
  released = false;

  if (schedule.stale) {
    el("alert-title").textContent = "Data belum diperbarui";
    el("alert-body").textContent =
      "Pembaruan terakhir yang berhasil " + stamp(Date.parse(schedule.updated_at_utc)) +
      ". Jadwal di bawah ini masih dari saat itu.";
    if (schedule.stale_reason) {
      el("alert-diagnostic").textContent = schedule.stale_reason;
      el("alert-diagnostic").hidden = false;
    }
    el("alert").hidden = false;
  }

  var next = resolveNextRelease(schedule);
  if (!next) {
    el("headline").textContent = "Jadwal tidak terbaca";
    el("when").textContent = "Isi schedule.json tidak sesuai format yang diharapkan.";
    el("timer").hidden = true;
    return;
  }

  el("headline").textContent = "Chapter " + schedule.next_chapter;
  document.title = "Chapter " + schedule.next_chapter + " - Chapter Tracker";

  var tag = el("tag");
  tag.textContent = next.confirmed ? "Terkonfirmasi" : "Perkiraan";
  tag.setAttribute("data-state", next.confirmed ? "confirmed" : "estimated");
  tag.hidden = false;

  el("when").textContent = stamp(next.at);

  if (!next.confirmed) {
    el("caveat").textContent = "Tanggal ini belum diumumkan MANGA Plus.";
    el("caveat").hidden = false;
  }

  var latest = Date.parse(schedule.latest_release_utc);
  var now = Date.now();

  // Only worth saying while the reader still loses a week to it. After the
  // skipped Sunday passes, the countdown carries the whole story.
  if (next.breakWeek && next.at - now > WEEK_MS) {
    el("break").hidden = false;
  }

  target = next.at;
  el("timer").hidden = false;

  if (now >= target) {
    released = true;
    render.released();
  } else {
    var span = next.at - latest;
    if (span > 0) {
      var ratio = Math.min(1, Math.max(0, (now - latest) / span));
      el("progress").hidden = false;
      requestAnimationFrame(function () {
        el("progress-fill").style.width = (ratio * 100).toFixed(2) + "%";
      });
    }
    tick();
  }

  el("updated").textContent = "Terakhir diperbarui " + stamp(Date.parse(schedule.updated_at_utc)) + ".";
}

function renderEpisodes(nodes) {
  var list = el("episodes");
  list.textContent = "";
  nodes.forEach(function (node) {
    var item = document.createElement("li");

    var num = document.createElement("span");
    num.className = "num";
    num.textContent = node.episode;

    var date = document.createElement("span");
    date.className = "date";
    date.textContent = shortDayWib.format(new Date(node.airingAt * 1000));

    var time = document.createElement("span");
    time.className = "time";
    time.textContent = clockWib.format(new Date(node.airingAt * 1000)) + " ";
    var zone = document.createElement("span");
    zone.className = "zone";
    zone.textContent = "WIB";
    time.appendChild(zone);

    item.appendChild(num);
    item.appendChild(date);
    item.appendChild(time);
    list.appendChild(item);
  });
  list.hidden = false;
  el("airing-status").hidden = true;
}

var AIRING_QUERY =
  "query($id:Int){Media(id:$id,type:ANIME){airingSchedule(notYetAired:true,perPage:4){nodes{episode airingAt}}}}";

function loadEpisodes() {
  return fetch("https://graphql.anilist.co", {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ query: AIRING_QUERY, variables: { id: 21 } })
  })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(function (payload) {
      var media = payload && payload.data && payload.data.Media;
      var nodes = media && media.airingSchedule ? media.airingSchedule.nodes : null;
      if (!nodes || nodes.length === 0) throw new Error("belum ada jadwal tayang");
      renderEpisodes(nodes);
    })
    .catch(function () {
      el("episodes").hidden = true;
      el("airing-status").textContent = "Jadwal tayang tidak bisa dimuat sekarang.";
      el("airing-status").hidden = false;
    });
}

function loadSchedule() {
  return fetch("./schedule.json", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(renderSchedule)
    .catch(function (error) {
      el("page").classList.remove("is-loading");
      el("headline").textContent = "Jadwal tidak bisa dimuat";
      el("when").textContent = "Gagal membaca schedule.json (" + error.message + ").";
      el("timer").hidden = true;
      target = null;
    });
}

var lastLoad = 0;
var REFRESH_AFTER_MS = 15 * 60 * 1000;

function load() {
  lastLoad = Date.now();
  loadSchedule();
  loadEpisodes();
}

// Pinned tabs sit in the background for days, where timers get throttled and
// the schedule goes out of date. Catch up the moment the tab is looked at.
document.addEventListener("visibilitychange", function () {
  if (document.hidden) return;
  tick();
  if (Date.now() - lastLoad > REFRESH_AFTER_MS) load();
});

load();
setInterval(tick, 1000);
</script>
</body>
</html>
